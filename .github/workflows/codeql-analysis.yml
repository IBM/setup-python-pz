name: CodeQL analysis

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  call-codeQL-analysis:
    name: CodeQL analysis
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: actions/reusable-workflows/.github/workflows/codeql-analysis.yml@main
